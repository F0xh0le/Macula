<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macula · clipboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23f0b429'/><circle cx='16' cy='16' r='5' fill='%230d1117'/></svg>">
<style>
$css
html, body { height: 100%; }
body {
  margin: 0; padding: 0;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.clip-top {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem;
  padding: .85rem 1.25rem;
  border-bottom: 1px solid var(--border-soft);
  background: var(--surface);
}
.clip-brand { display: flex; align-items: center; gap: .8rem; min-width: 0; }
.clip-brand .brand-mark { width: 28px; height: 28px; flex: 0 0 28px; }
.clip-brand .brand-mark::after { display: none; }
.clip-brand-name {
  font-family: var(--font-mono); font-size: .95rem; font-weight: 700;
  letter-spacing: .14em; color: var(--text-strong);
}
.clip-brand-sub {
  display: block; font-size: .68rem; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: .14em; margin-top: .15rem;
}
.clip-top-actions { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }

.clip-layout {
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: 340px 1fr;
  min-height: 0;
}
@media (max-width: 720px) {
  .clip-layout { grid-template-columns: 1fr; grid-template-rows: 40% 1fr; }
}

.clip-side {
  border-right: 1px solid var(--border-soft);
  display: flex; flex-direction: column;
  min-height: 0;
  background: var(--bg-elev);
}
@media (max-width: 720px) {
  .clip-side { border-right: none; border-bottom: 1px solid var(--border-soft); }
}

.clip-side-search {
  padding: .55rem .75rem;
  border-bottom: 1px solid var(--border-soft);
  background: var(--surface);
}
.clip-side-search .search-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.clip-side-search input {
  width: 100%;
  padding: .45rem 2.1rem .45rem .65rem;
  font-family: var(--font-ui); font-size: .85rem;
  color: var(--text); background: var(--bg-elev);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  outline: none; transition: border-color .12s;
}
.clip-side-search input::placeholder { color: var(--text-dim); }
.clip-side-search input:focus {
  border-color: var(--primary); background: var(--surface-2);
}
.clip-side-search .regex-toggle {
  position: absolute; right: .3rem;
  width: 24px; height: 24px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid transparent;
  border-radius: 4px;
  color: var(--text-dim);
  font-family: var(--font-mono); font-size: .75rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .12s;
}
.clip-side-search .regex-toggle:hover {
  background: var(--surface-3); border-color: var(--border); color: var(--text);
}
.clip-side-search .regex-toggle.active {
  background: rgba(88, 166, 255, .12);
  border-color: var(--primary); color: var(--primary);
}
.clip-side-search .regex-toggle.error {
  border-color: var(--danger); color: var(--danger);
  background: rgba(248, 81, 73, .1);
}

.clip-side-meta {
  padding: .4rem .9rem;
  border-bottom: 1px solid var(--border-soft);
  background: var(--bg-elev);
  font-family: var(--font-mono); font-size: .7rem;
  text-transform: uppercase; letter-spacing: .12em;
  color: var(--text-dim);
  display: flex; align-items: baseline; gap: .5rem;
}
.clip-side-meta .filter-tag {
  color: var(--macula);
  text-transform: none; letter-spacing: 0;
}
.clip-side-meta .filter-tag.regex { color: var(--primary); }
.clip-side-meta .filter-tag.error { color: var(--danger); }

.clip-list { flex: 1 1 auto; overflow-y: auto; padding: .35rem 0; }
.clip-empty {
  padding: 2rem 1rem; text-align: center;
  color: var(--text-dim); font-size: .85rem;
  font-style: italic;
}
.clip-row {
  padding: .55rem .9rem;
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: background .1s;
}
.clip-row:hover { background: var(--surface-3); }
.clip-row.selected {
  background: var(--surface-2);
  border-left-color: var(--macula);
}
.clip-row-meta {
  display: flex; gap: .55rem; align-items: baseline;
  font-family: var(--font-mono); font-size: .7rem;
  color: var(--text-dim);
}
.clip-row-id { color: var(--primary); font-weight: 600; }
.clip-row-ts { margin-left: auto; }
.clip-row-size { color: var(--text-muted); }
.clip-row-preview {
  margin-top: .25rem;
  font-family: var(--font-mono); font-size: .8rem;
  color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.clip-row mark {
  background: var(--macula); color: #0d1117;
  padding: 0 2px; border-radius: 3px; font-weight: 700;
}

.clip-view {
  display: flex; flex-direction: column;
  min-height: 0;
  background: var(--bg);
}
.clip-view-head {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  gap: .75rem;
  padding: .65rem 1rem;
  border-bottom: 1px solid var(--border-soft);
  background: var(--surface);
  min-height: 46px;
  flex-wrap: wrap;
}
.clip-view-title {
  font-family: var(--font-mono); font-size: .85rem;
  color: var(--text-strong);
  display: flex; align-items: baseline; gap: .75rem;
  min-width: 0;
}
.clip-view-ts { font-size: .7rem; color: var(--text-dim); }
.clip-view-dot {
  display: inline-block; width: 6px; height: 6px;
  border-radius: 50%;
  margin-left: .5rem;
  vertical-align: middle;
  background: transparent;
  transition: background .2s;
}
.clip-view-dot.dirty { background: var(--macula); box-shadow: 0 0 8px var(--macula); }
.clip-view-dot.saved { background: var(--success); }
.clip-view-actions { display: flex; gap: .5rem; flex-shrink: 0; flex-wrap: wrap; }

.clip-view-body {
  flex: 1 1 auto;
  display: flex; flex-direction: column;
  min-height: 0;
}
.clip-textarea {
  flex: 1 1 auto;
  margin: 0; padding: 1rem 1.25rem;
  font-family: var(--font-mono); font-size: .85rem;
  line-height: 1.55;
  color: var(--text); background: var(--bg);
  border: none; outline: none;
  resize: none;
  min-height: 0;
}
.clip-textarea::placeholder { color: var(--text-dim); font-style: italic; }

.clip-status {
  flex: 0 0 auto;
  padding: .35rem 1rem;
  border-top: 1px solid var(--border-soft);
  font-family: var(--font-mono); font-size: .75rem;
  min-height: 1.65em;
  background: var(--surface);
  color: var(--text-muted);
}
.clip-status.ok { color: var(--success); }
.clip-status.err { color: var(--danger); }
.clip-status.busy { color: var(--macula); }

.btn-group-views {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  flex-shrink: 0;
}
.btn-group-views a {
  display: inline-flex; align-items: center; gap: .35rem;
  padding: .35rem .6rem;
  font-family: var(--font-mono); font-size: .72rem;
  color: var(--text-muted); background: var(--bg-elev);
  text-decoration: none;
  border-right: 1px solid var(--border);
  transition: all .12s;
  line-height: 1;
  white-space: nowrap;
}
.btn-group-views a:last-child { border-right: none; }
.btn-group-views a:hover {
  background: var(--surface-3); color: var(--primary);
}
.btn-group-views a.active {
  background: var(--surface-3); color: var(--text-strong);
}

/* ---- back to top (sticky, bottom-left) ---- */
.back-to-top {
  position: fixed;
  bottom: 1.25rem;
  left: 1.25rem;
  width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-2);
  color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: 50%;
  font-size: 1.1rem;
  text-decoration: none;
  box-shadow: var(--shadow);
  transition: opacity .18s ease, transform .18s ease,
              background .12s, color .12s, border-color .12s;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  cursor: pointer;
  line-height: 1;
}
.back-to-top.visible {
  opacity: 1;
  pointer-events: auto;
}
.back-to-top:hover {
  background: var(--surface-3);
  color: var(--primary);
  border-color: var(--primary);
  transform: translateY(-2px);
}
.back-to-top:active {
  transform: translateY(0);
}
.back-to-top .icon { width: 18px; height: 18px; }
</style>
</head>
<body>

<div class="clip-top">
  <div class="clip-brand">
    <div class="brand-mark" aria-hidden="true"></div>
    <div>
      <div class="clip-brand-name">MACULA<span style="color:var(--macula)"> · clipboard</span></div>
      <span class="clip-brand-sub">shared rooms · v$version</span>
    </div>
  </div>
  <div class="clip-top-actions">
    <button class="btn btn-primary" id="newRoomBtn" type="button">+ New room</button>
    <button class="btn" id="clearAllBtn" type="button">Clear all</button>
    <div class="btn-group-views" id="listViews">
      <a href="#" id="listJsonLink" title="List as JSON">JSON</a>
      <a href="#" id="listTextLink" title="List as plain text">Text</a>
    </div>
    <a class="btn btn-ghost" href="/">Back to files</a>
  </div>
</div>

<div class="clip-layout">
  <aside class="clip-side">
    <div class="clip-side-search">
      <div class="search-wrap">
        <input type="search" id="searchInput"
               placeholder="Search rooms… (Alt+R for regex)"
               autocomplete="off" spellcheck="false">
        <button class="regex-toggle" id="regexToggle" type="button"
                title="Use regular expressions (Alt+R)">.*</button>
      </div>
    </div>
    <div class="clip-side-meta">
      <span id="roomCount">0 rooms</span>
      <span class="filter-tag" id="filterTag" style="display:none;"></span>
    </div>
    <div class="clip-list" id="roomList"></div>
  </aside>
  <main class="clip-view">
    <div class="clip-view-head">
      <div class="clip-view-title" id="viewTitle">No room selected</div>
      <div class="clip-view-actions" id="viewActions"></div>
    </div>
    <div class="clip-view-body" id="viewBody">
      <div class="clip-empty">Select a room on the left, or create one.</div>
    </div>
    <div class="clip-status" id="clipStatus"></div>
  </main>
</div>

<a href="#" class="back-to-top" id="backToTop" aria-label="Back to top" title="Back to top">
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 19V5M5 12l7-7 7 7"/>
  </svg>
</a>

<script>
(function () {
  const API         = $endpoint_js;
  const INITIAL_ID  = $initial_id_js;
  const POLL_MS     = $poll_ms_js;
  const AUTOSAVE_MS = $autosave_ms_js;

  const roomListEl   = document.getElementById('roomList');
  const roomCountEl  = document.getElementById('roomCount');
  const filterTagEl  = document.getElementById('filterTag');
  const searchInput  = document.getElementById('searchInput');
  const regexToggle  = document.getElementById('regexToggle');
  const titleEl      = document.getElementById('viewTitle');
  const actionsEl    = document.getElementById('viewActions');
  const bodyEl       = document.getElementById('viewBody');
  const statusEl     = document.getElementById('clipStatus');
  const newRoomBtn   = document.getElementById('newRoomBtn');
  const clearAllBtn  = document.getElementById('clearAllBtn');
  const listJsonLink = document.getElementById('listJsonLink');
  const listTextLink = document.getElementById('listTextLink');
  const backToTopBtn = document.getElementById('backToTop');

  let selectedId = null;
  let dirty = false;
  let lastServerText = '';
  let lastListSnapshot = '';
  let statusTimer = null;
  let autosaveTimer = null;
  let inflightAutosave = null;

  let searchMode = 'substring';
  try {
    const saved = localStorage.getItem('macula_clipboard_search_mode');
    if (saved === 'regex') searchMode = 'regex';
  } catch (e) {}
  if (regexToggle && searchMode === 'regex') regexToggle.classList.add('active');

  // ------------------------------------------------------------ utilities
  function setStatus(msg, cls) {
    if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; }
    statusEl.textContent = msg || '';
    statusEl.className = 'clip-status' + (cls ? ' ' + cls : '');
    if (msg) {
      statusTimer = setTimeout(function () {
        if (statusEl.textContent === msg) setStatus('');
      }, 3500);
    }
  }
  function relTime(ts) {
    const dt = Date.now() / 1000 - ts;
    if (dt < 5) return 'now';
    if (dt < 60) return Math.floor(dt) + 's';
    if (dt < 3600) return Math.floor(dt / 60) + 'm';
    if (dt < 86400) return Math.floor(dt / 3600) + 'h';
    return Math.floor(dt / 86400) + 'd';
  }
  function humanSize(n) {
    for (const u of ['B', 'K', 'M', 'G']) {
      if (n < 1024) return Math.round(n) + u;
      n /= 1024;
    }
    return n.toFixed(1) + 'T';
  }
  function debounce(fn, ms) {
    let t = null;
    return function () {
      const ctx = this, args = arguments;
      if (t) clearTimeout(t);
      t = setTimeout(function () { t = null; fn.apply(ctx, args); }, ms);
    };
  }

  async function apiFetch(url, opts) {
    const r = await fetch(url, opts);
    if (!r.ok) {
      let msg = 'HTTP ' + r.status;
      try {
        const data = await r.json();
        if (data && data.error) msg = data.error;
      } catch (e) {}
      throw new Error(msg);
    }
    return r.json();
  }

  // --------------------------------------------------------------- search
  function currentQuery() {
    return (searchInput.value || '').trim();
  }
  function isRegexValid(q) {
    if (!q || searchMode !== 'regex') return true;
    try { new RegExp(q, 'i'); return true; }
    catch (e) { return false; }
  }
  function searchParams() {
    const q = currentQuery();
    if (!q) return '';
    const parts = ['q=' + encodeURIComponent(q)];
    if (searchMode === 'regex') parts.push('regex=1');
    return '&' + parts.join('&');
  }
  function refreshRegexIndicator() {
    const q = currentQuery();
    const bad = q && searchMode === 'regex' && !isRegexValid(q);
    regexToggle.classList.toggle('error', !!bad);
    if (bad) {
      filterTagEl.style.display = '';
      filterTagEl.textContent = 'invalid regex';
      filterTagEl.className = 'filter-tag error';
    } else if (!q) {
      filterTagEl.style.display = 'none';
    }
  }

  function updateListViewLinks() {
    const qs = searchParams();
    listJsonLink.href = API + '?format=json' + qs;
    listTextLink.href = API + '?format=text' + qs;
  }

  // ---------------------------------------------------------- room list
  function highlight(el, text, compiled) {
    if (!compiled) { el.textContent = text; return; }
    if (compiled.needle !== undefined) {
      const frag = document.createDocumentFragment();
      const lower = text.toLowerCase();
      let i = 0;
      while (i < text.length) {
        const idx = lower.indexOf(compiled.needle, i);
        if (idx === -1) {
          frag.appendChild(document.createTextNode(text.slice(i)));
          break;
        }
        if (idx > i) frag.appendChild(document.createTextNode(text.slice(i, idx)));
        const mark = document.createElement('mark');
        mark.textContent = text.slice(idx, idx + compiled.needle.length);
        frag.appendChild(mark);
        i = idx + compiled.needle.length;
      }
      el.replaceChildren(frag);
    } else if (compiled.re) {
      const frag = document.createDocumentFragment();
      const gre = new RegExp(compiled.re.source, 'gi');
      let last = 0, m, guard = 0;
      while ((m = gre.exec(text)) !== null && guard++ < 5000) {
        if (m.index > last) {
          frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        }
        const mark = document.createElement('mark');
        mark.textContent = m[0];
        frag.appendChild(mark);
        last = m.index + m[0].length;
        if (m[0].length === 0) gre.lastIndex++;
      }
      if (last < text.length) {
        frag.appendChild(document.createTextNode(text.slice(last)));
      }
      el.replaceChildren(frag);
    }
  }

  function compileSearchForHighlight() {
    const q = currentQuery();
    if (!q) return null;
    if (searchMode === 'regex') {
      try { return { re: new RegExp(q, 'i') }; }
      catch (e) { return null; }
    }
    return { needle: q.toLowerCase() };
  }

  function renderRoomList(rooms, filtered) {
    roomListEl.innerHTML = '';
    const compiled = filtered ? compileSearchForHighlight() : null;
    if (!rooms.length) {
      const empty = document.createElement('div');
      empty.className = 'clip-empty';
      empty.textContent = filtered
        ? 'No room matches the filter'
        : 'No rooms yet — click "+ New room"';
      roomListEl.appendChild(empty);
      return;
    }
    for (const r of rooms) {
      const row = document.createElement('div');
      row.className = 'clip-row' + (r.id === selectedId ? ' selected' : '');
      row.dataset.id = r.id;

      const meta = document.createElement('div');
      meta.className = 'clip-row-meta';

      const idEl = document.createElement('span');
      idEl.className = 'clip-row-id';
      idEl.textContent = '#' + r.id;

      const sizeEl = document.createElement('span');
      sizeEl.className = 'clip-row-size';
      sizeEl.textContent = humanSize(r.size);

      const tsEl = document.createElement('span');
      tsEl.className = 'clip-row-ts';
      tsEl.textContent = relTime(r.ts);

      meta.append(idEl, sizeEl, tsEl);

      const preview = document.createElement('div');
      preview.className = 'clip-row-preview';
      if (r.preview) {
        if (compiled) highlight(preview, r.preview, compiled);
        else preview.textContent = r.preview;
      } else {
        preview.textContent = '(empty)';
        preview.style.opacity = '.5';
        preview.style.fontStyle = 'italic';
      }

      row.append(meta, preview);
      row.addEventListener('click', function () { selectRoom(r.id); });
      roomListEl.appendChild(row);
    }
  }

  async function refreshList(force) {
    try {
      const data = await apiFetch(API + '?format=json' + searchParams());
      const rooms = data.rooms || [];
      const filtered = !!data.filtered;

      if (filtered) {
        roomCountEl.textContent =
          rooms.length + (rooms.length === 1 ? ' match' : ' matches');
      } else {
        roomCountEl.textContent =
          rooms.length + (rooms.length === 1 ? ' room' : ' rooms');
      }

      const badRegex = searchMode === 'regex' && currentQuery() &&
                       !isRegexValid(currentQuery());
      if (badRegex) {
        /* leave it to refreshRegexIndicator */
      } else if (filtered) {
        filterTagEl.style.display = '';
        filterTagEl.textContent = searchMode === 'regex' ? '/regex/' : 'filter';
        filterTagEl.className = 'filter-tag' +
          (searchMode === 'regex' ? ' regex' : '');
      } else {
        filterTagEl.style.display = 'none';
      }

      const snap = rooms
        .map(function (r) { return r.id + ':' + r.size + ':' + r.ts; })
        .join(',') + '|' + (filtered ? '1' : '0');
      if (!force && snap === lastListSnapshot
          && roomListEl.dataset.rendered === '1') {
        return;
      }
      lastListSnapshot = snap;
      renderRoomList(rooms, filtered);
      roomListEl.dataset.rendered = '1';
      for (const r of roomListEl.querySelectorAll('.clip-row')) {
        r.classList.toggle('selected', Number(r.dataset.id) === selectedId);
      }
      updateListViewLinks();
    } catch (e) {
      setStatus('List error: ' + e.message, 'err');
    }
  }

  // --------------------------------------------------------------- viewer
  function resetUrl() {
    try { history.replaceState(null, '', API); } catch (e) {}
  }
  function roomUrl(id) {
    try { history.replaceState(null, '', API + '?id=' + id); } catch (e) {}
  }

  function setDirtyIndicator() {
    const dot = document.getElementById('dirtyDot');
    if (!dot) return;
    dot.classList.toggle('dirty', dirty);
    dot.classList.remove('saved');
  }
  function flashSaved() {
    const dot = document.getElementById('dirtyDot');
    if (!dot) return;
    dot.classList.remove('dirty');
    dot.classList.add('saved');
    setTimeout(function () {
      if (dot) dot.classList.remove('saved');
    }, 1200);
  }

  function clearViewer(msg) {
    selectedId = null;
    dirty = false;
    lastServerText = '';
    if (autosaveTimer) { clearTimeout(autosaveTimer); autosaveTimer = null; }
    titleEl.textContent = msg || 'No room selected';
    actionsEl.innerHTML = '';
    bodyEl.innerHTML = '<div class="clip-empty">' +
      (msg || 'Select a room on the left, or create one.') + '</div>';
    resetUrl();
  }

  function renderRoomNotFound(id) {
    selectedId = null;
    dirty = false;
    lastServerText = '';
    if (autosaveTimer) { clearTimeout(autosaveTimer); autosaveTimer = null; }
    titleEl.textContent = 'Room #' + id + ' not found';
    actionsEl.innerHTML = '';
    bodyEl.innerHTML = '';

    const box = document.createElement('div');
    box.className = 'clip-empty';
    box.textContent = 'Room #' + id + ' does not exist.';
    const btn = document.createElement('button');
    btn.className = 'btn btn-primary';
    btn.textContent = 'Create a new room';
    btn.style.marginTop = '1rem';
    btn.addEventListener('click', function () { createRoom(); });
    box.appendChild(document.createElement('br'));
    box.appendChild(btn);
    bodyEl.appendChild(box);
  }

  function renderRoom(room) {
    selectedId = room.id;
    lastServerText = room.text;
    dirty = false;
    if (autosaveTimer) { clearTimeout(autosaveTimer); autosaveTimer = null; }

    titleEl.innerHTML = '';
    const idSpan = document.createElement('span');
    idSpan.textContent = '#' + room.id;
    titleEl.appendChild(idSpan);

    const dot = document.createElement('span');
    dot.className = 'clip-view-dot';
    dot.id = 'dirtyDot';
    titleEl.appendChild(dot);

    const ts = document.createElement('span');
    ts.className = 'clip-view-ts';
    ts.textContent = new Date(room.ts * 1000).toLocaleString();
    titleEl.appendChild(ts);

    actionsEl.innerHTML = '';

    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn btn-primary';
    copyBtn.textContent = 'Copy';
    copyBtn.addEventListener('click', async function () {
      const ta = bodyEl.querySelector('textarea');
      const text = ta ? ta.value : lastServerText;
      const ok = await copyText(text);
      setStatus(ok ? 'Copied to clipboard'
                   : 'Copy failed — select the text and press Ctrl+C',
                ok ? 'ok' : 'err');
    });
    actionsEl.appendChild(copyBtn);

    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn';
    saveBtn.textContent = 'Save now';
    saveBtn.addEventListener('click', function () { saveRoom(false); });
    actionsEl.appendChild(saveBtn);

    const clearBtn = document.createElement('button');
    clearBtn.className = 'btn';
    clearBtn.textContent = 'Clear text';
    clearBtn.addEventListener('click', async function () {
      if (!confirm('Empty the text of room #' + room.id +
                   '? The room itself stays.')) return;
      if (autosaveTimer) { clearTimeout(autosaveTimer); autosaveTimer = null; }
      try {
        await apiFetch(API + '?action=clear&id=' + room.id,
                       { method: 'POST' });
        lastListSnapshot = '';
        await selectRoom(room.id, true);
      } catch (e) {
        setStatus('Clear error: ' + e.message, 'err');
      }
    });
    actionsEl.appendChild(clearBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'btn';
    delBtn.textContent = 'Delete room';
    delBtn.addEventListener('click', async function () {
      if (!confirm('Delete room #' + room.id +
                   ' and its text?')) return;
      if (autosaveTimer) { clearTimeout(autosaveTimer); autosaveTimer = null; }
      try {
        await apiFetch(API + '?action=delete&id=' + room.id,
                       { method: 'POST' });
        lastListSnapshot = '';
        clearViewer('Select a room on the left');
        refreshList(true);
      } catch (e) {
        setStatus('Delete error: ' + e.message, 'err');
      }
    });
    actionsEl.appendChild(delBtn);

    const viewsGroup = document.createElement('div');
    viewsGroup.className = 'btn-group-views';

    const roomJson = document.createElement('a');
    roomJson.href = API + '?format=json&id=' + room.id;
    roomJson.title = 'This room as JSON';
    roomJson.textContent = 'JSON';
    viewsGroup.appendChild(roomJson);

    const roomText = document.createElement('a');
    roomText.href = API + '?format=text&id=' + room.id;
    roomText.title = 'This room as plain text (with header)';
    roomText.textContent = 'Text';
    viewsGroup.appendChild(roomText);

    const roomRaw = document.createElement('a');
    roomRaw.href = API + '?format=raw&id=' + room.id;
    roomRaw.title = 'Raw text only — pipe-friendly';
    roomRaw.textContent = 'Raw';
    viewsGroup.appendChild(roomRaw);

    actionsEl.appendChild(viewsGroup);

    bodyEl.innerHTML = '';
    const ta = document.createElement('textarea');
    ta.className = 'clip-textarea';
    ta.value = room.text;
    ta.placeholder = 'Empty room. Start typing — autosave kicks in after ' +
                     (AUTOSAVE_MS / 1000) + 's.';
    ta.addEventListener('input', function () {
      dirty = ta.value !== lastServerText;
      setDirtyIndicator();
      if (autosaveTimer) clearTimeout(autosaveTimer);
      if (dirty) {
        autosaveTimer = setTimeout(function () {
          autosaveTimer = null;
          if (dirty && selectedId !== null) saveRoom(true);
        }, AUTOSAVE_MS);
      }
    });
    ta.addEventListener('keydown', function (e) {
      if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        if (autosaveTimer) { clearTimeout(autosaveTimer); autosaveTimer = null; }
        saveRoom(false);
      }
    });
    bodyEl.appendChild(ta);

    roomUrl(room.id);
  }

  async function flushPendingAutosave() {
    if (autosaveTimer) {
      clearTimeout(autosaveTimer);
      autosaveTimer = null;
    }
    if (inflightAutosave) {
      try { await inflightAutosave; } catch (e) {}
    }
    if (dirty && selectedId !== null) {
      await saveRoom(true);
    }
  }

  async function selectRoom(id, force) {
    if (!force && id === selectedId) return;
    await flushPendingAutosave();
    try {
      const data = await apiFetch(API + '?format=json&id=' + id);
      if (!data.room) { renderRoomNotFound(id); return; }
      renderRoom(data.room);
    } catch (e) {
      if (e.message.startsWith('HTTP 404')) {
        renderRoomNotFound(id);
        return;
      }
      setStatus('Load error: ' + e.message, 'err');
    }
  }

  async function createRoom() {
    await flushPendingAutosave();
    setStatus('Creating…', 'busy');
    try {
      const r = await fetch(API + '?action=create',
                            { method: 'POST', body: '' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      lastListSnapshot = '';
      await refreshList(true);
      await selectRoom(data.id, true);
      setStatus('Created #' + data.id, 'ok');
    } catch (e) {
      setStatus('Create error: ' + e.message, 'err');
    }
  }

  async function saveRoom(silent) {
    if (selectedId === null) return;
    const ta = bodyEl.querySelector('textarea');
    if (!ta) return;
    const text = ta.value;
    if (text === lastServerText && silent) return;
    if (!silent) setStatus('Saving…', 'busy');

    const capturedId = selectedId;
    const capturedText = text;

    inflightAutosave = (async function () {
      try {
        const r = await fetch(API + '?action=update&id=' + capturedId,
                              { method: 'POST', body: capturedText });
        if (!r.ok) {
          let msg = 'HTTP ' + r.status;
          try {
            const d = await r.json();
            if (d.error) msg = d.error;
          } catch (e) {}
          throw new Error(msg);
        }
        if (selectedId === capturedId) {
          lastServerText = capturedText;
          dirty = (ta.value !== capturedText);
          setDirtyIndicator();
          lastListSnapshot = '';
          refreshList(false);
          flashSaved();
          setStatus(silent ? 'Autosaved' : 'Saved', 'ok');
        }
      } catch (e) {
        setStatus((silent ? 'Autosave' : 'Save') + ' error: ' + e.message,
                  'err');
        throw e;
      } finally {
        inflightAutosave = null;
      }
    })();
    return inflightAutosave;
  }

  // ------------------------------------------------------------ polling
  async function pollSelected() {
    if (selectedId === null) return;
    try {
      const data = await apiFetch(API + '?format=json&id=' + selectedId);
      if (!data.room) {
        clearViewer('Room no longer exists');
        lastListSnapshot = '';
        refreshList(true);
        return;
      }
      const serverText = data.room.text;
      const tsEl = titleEl.querySelector('.clip-view-ts');
      if (serverText === lastServerText) {
        if (tsEl) tsEl.textContent =
          new Date(data.room.ts * 1000).toLocaleString();
        return;
      }
      if (!dirty) {
        const ta = bodyEl.querySelector('textarea');
        if (ta) {
          const active = document.activeElement === ta;
          const selStart = ta.selectionStart;
          const selEnd = ta.selectionEnd;
          const scrollTop = ta.scrollTop;
          ta.value = serverText;
          if (active) {
            try { ta.setSelectionRange(selStart, selEnd); } catch (e) {}
          }
          ta.scrollTop = scrollTop;
        }
        lastServerText = serverText;
        if (tsEl) tsEl.textContent =
          new Date(data.room.ts * 1000).toLocaleString();
      } else {
        if (tsEl) tsEl.textContent =
          'edited locally · server changed ' +
          new Date(data.room.ts * 1000).toLocaleTimeString();
      }
    } catch (e) {
      /* silent — transient */
    }
  }

  // ------------------------------------------------------------------ copy
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text)
        .then(function () { return true; })
        .catch(function () { return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }

  // ------------------------------------------------------------- save-on-exit
  window.addEventListener('beforeunload', function () {
    if (!dirty || selectedId === null) return;
    const ta = bodyEl.querySelector('textarea');
    if (!ta) return;
    try {
      const blob = new Blob([ta.value], { type: 'text/plain;charset=utf-8' });
      navigator.sendBeacon(API + '?action=update&id=' + selectedId, blob);
    } catch (e) {
      /* sendBeacon unsupported */
    }
  });

  // --------------------------------------------------------------- buttons
  newRoomBtn.addEventListener('click', createRoom);
  clearAllBtn.addEventListener('click', async function () {
    if (!confirm('Delete ALL rooms and their contents?')) return;
    await flushPendingAutosave();
    try {
      await apiFetch(API + '?action=clear_all', { method: 'POST' });
      lastListSnapshot = '';
      clearViewer('All rooms deleted');
      refreshList(true);
      setStatus('All rooms deleted', 'ok');
    } catch (e) {
      setStatus('Error: ' + e.message, 'err');
    }
  });

  // ------------------------------------------------------------- search UI
  function setSearchMode(mode) {
    searchMode = mode;
    regexToggle.classList.toggle('active', mode === 'regex');
    try {
      localStorage.setItem('macula_clipboard_search_mode', mode);
    } catch (e) {}
    refreshRegexIndicator();
    lastListSnapshot = '';
    refreshList(true);
  }

  regexToggle.addEventListener('click', function (e) {
    e.preventDefault();
    setSearchMode(searchMode === 'regex' ? 'substring' : 'regex');
  });

  searchInput.addEventListener('input', debounce(function () {
    refreshRegexIndicator();
    lastListSnapshot = '';
    refreshList(true);
  }, 250));
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      searchInput.value = '';
      refreshRegexIndicator();
      lastListSnapshot = '';
      refreshList(true);
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.altKey && !e.ctrlKey && !e.metaKey
        && (e.key === 'r' || e.key === 'R')) {
      e.preventDefault();
      setSearchMode(searchMode === 'regex' ? 'substring' : 'regex');
    }
  });

  // -------------------------------------------------------- back-to-top
  function updateBackToTop() {
    if (!backToTopBtn) return;
    if (window.scrollY > 300) backToTopBtn.classList.add('visible');
    else backToTopBtn.classList.remove('visible');
  }
  if (backToTopBtn) {
    backToTopBtn.addEventListener('click', function (e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    window.addEventListener('scroll', updateBackToTop, { passive: true });
    updateBackToTop();
  }

  // ------------------------------------------------------------------ init
  refreshRegexIndicator();
  updateListViewLinks();
  refreshList(true);
  if (INITIAL_ID !== null && INITIAL_ID !== undefined) {
    selectRoom(INITIAL_ID, true);
  }
  setInterval(function () { refreshList(false); }, POLL_MS);
  setInterval(pollSelected, POLL_MS);
})();
</script>
</body>
</html>
